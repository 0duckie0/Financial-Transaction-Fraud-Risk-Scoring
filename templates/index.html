<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fraud Risk Scoring Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="dashboard-wrapper">
        <nav class="top-nav">
            <div class="logo">
                <span class="neon-dot"></span>
                <span>RiskSight</span>
            </div>
            <div class="profile-pill">
                <img src="https://ui-avatars.com/api/?name=Parth+Chaudhari&background=00e676&color=000&bold=true" alt="User" class="avatar">
                <span class="user-name">Parth Chaudhari</span>
            </div>
        </nav>

        <main class="content">
            <div class="card glass-card">
                <div class="card-header">
                    <h2>Transaction Risk Evaluation</h2>
                    <span class="badge">Live Inference</span>
                </div>
                
                <form id="fraudForm">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>Transaction Amount ($)</label>
                            <input type="number" id="amount" step="0.01" required placeholder="e.g. 1250.00">
                        </div>
                        <div class="input-group">
                            <label>Transaction Time (Hour: 0-23)</label>
                            <input type="number" id="time" required placeholder="e.g. 14">
                        </div>

                        <div class="input-group">
                            <label>Merchant Category</label>
                            <select id="merchant" required>
                                <option value="" disabled selected>Select category...</option>
                                <option value="clothing">Clothing</option>
                                <option value="electronics">Electronics</option>
                                <option value="food">Food</option>
                                <option value="grocery">Grocery</option>
                                <option value="travel">Travel</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Foreign Transaction</label>
                            <select id="foreign" required>
                                <option value="0">No (Domestic)</option>
                                <option value="1">Yes (International)</option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>Location Risk Score (0-1)</label>
                            <input type="number" id="location" step="1" required placeholder="e.g. 0">
                        </div>
                        <div class="input-group">
                            <label>Device Trust Score (0-100)</label>
                            <input type="number" id="device" required placeholder="e.g. 85">
                        </div>
                        <div class="input-group">
                            <label>Velocity (Txns last 24h)</label>
                            <input type="number" id="velocity" required placeholder="e.g. 3">
                        </div>
                        <div class="input-group">
                            <label>Cardholder Age</label>
                            <input type="number" id="age" required placeholder="e.g. 42">
                        </div>
                    </div>
                    
                    <button type="submit" class="neon-btn full-width">Analyze Transaction Risk</button>
                </form>
            </div>

            <div id="resultBox" class="card hidden">
                <div class="result-content">
                    <h3 id="riskTier"></h3>
                    <p id="riskScore"></p>
                </div>
            </div>
        </main>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
